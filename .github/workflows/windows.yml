name: Windows CUDA Build

on:
  push:
    branches: [ dev, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ dev, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# ===========================================================================
# 工具链版本（唯一真源）—— 2026-09 全部取最新
#
#  默认 = 最新栈（字面量均已核实）：
#    CUDA 13.4.2  : 最新版（12.10 不存在；12.x 止于 12.9.2）。
#                   Windows 安装器 cuda_13.4.2_windows_x86_64.exe（命名规则已变，
#                   不再带驱动版本号），取自官方下载页 exe (local) 链接。
#    VS 2026 18.x : CUDA 13.4 官方编译器支持表列 "MSVC 195x / VS 2026 18.x = YES"。
#                   镜像 windows-2025-vs2026，VS 装在 \18\Enterprise。
#    Python 3.14  : 由 uv 安装并持有。
#    actions      : checkout v7 / cache v6 / setup-uv v10.2.0 / upload-artifact v7。
#
#  ⚠ 若 configure 阶段（CUDA 编译器识别）失败，整段 env 换成下面这段兼容栈，
#     并把 build-windows 与 package-windows **两处** runs-on 都改成 windows-2022：
#
#    CUDA_VERSION: "12.9.2"
#    CUDA_ROOT: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9'
#    CUDA_INSTALLER: "https://developer.download.nvidia.com/compute/cuda/12.9.2/local_installers/cuda_12.9.2_576.57_windows.exe"
#    CUDA_PATH_ENV_NAME: "CUDA_PATH_V12_9"
#    VCVARS: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat'
#
#  已核实的几处风险点（本轮验证结论，供判断是否需要升级）：
#    1. BUILD_CUDA_MIN_SM 默认 75，PORTABLE 走 75-virtual PTX-only；
#       CUDA 13 砍掉的是 <75，sm_75 仍在支持范围 → 架构不会卡住。
#    2. VS2026 镜像含 C++ Clang 组件（VC.Llvm.Clang / ClangToolset，LLVM 20.1.8），
#       libplacebo 端口所需的 clang-cl 可用。
#    3. BUILD_PORTABLE 在代码层强制关闭 LFS_DEV_IMPORT_SOURCE_{RESOURCES,PYTHON}
#       （两处均有 AND NOT BUILD_PORTABLE 守卫），开发路径不会漏进分发包。
# ===========================================================================
env:
  CUDA_VERSION: "13.4.2"
  CUDA_ROOT: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.4'
  CUDA_INSTALLER: "https://developer.download.nvidia.com/compute/cuda/13.4.2/local_installers/cuda_13.4.2_windows_x86_64.exe"
  # nvcc 12.9 不认 VS2026 的 MSVC 195x；如需钉回老工具集（VS2026 镜像并排装了 14.44），
  # 设为 '-vcvars_ver=14.44'。走 CUDA 13.4 时留空即用默认工具集。
  VCVARS_ARGS: ''
  CUDA_PATH_ENV_NAME: "CUDA_PATH_V13_4"
  PYTHON_VERSION: "3.14"
  VCVARS: 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat'

jobs:
  windows-preflight:
    uses: ./.github/workflows/windows-build-preflight.yml

  # -------------------------------------------------------------------------
  # 不碰 C++/CUDA，留在通用最新 Windows 镜像即可。
  # -------------------------------------------------------------------------
  test-plugin-venv:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      # uv 负责安装并持有 Python 3.14（原先是手写的 python-3.12.8-embed-amd64.zip）
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: Resolve the uv-managed Python
        shell: pwsh
        run: |
          uv --version
          uv python install $env:PYTHON_VERSION
          # 在临时目录解析，避免仓库内 .venv 抢答
          Push-Location $env:TEMP
          $PYTHON = (uv python find $env:PYTHON_VERSION | Select-Object -Last 1).Trim()
          Pop-Location
          if (-not $PYTHON -or -not (Test-Path $PYTHON)) {
            Write-Error "FAIL: uv 未能提供 Python $env:PYTHON_VERSION 解释器"
            exit 1
          }
          "UV_TEST_PYTHON=$PYTHON" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $PYTHON --version

      # 注意：这里原先覆盖的是 python-3.12.8 embeddable 发行版，现在跑的是 uv 托管的
      # 完整 CPython 3.14，python3xx._pth / 精简 stdlib 那个边界不再被覆盖。
      # 如果产品仍内置 embeddable 发行版，请另加一个独立步骤把它按 3.14 下回来测。
      - name: Test uv sync with uv-managed Python 3.14
        shell: pwsh
        run: |
          $PYTHON = $env:UV_TEST_PYTHON

          $PLUGIN = "$env:TEMP\test_plugin"
          New-Item -ItemType Directory -Force -Path $PLUGIN
          @"
          [project]
          name = "test-plugin"
          version = "0.1.0"
          requires-python = ">=3.14"
          dependencies = []
          "@ | Set-Content "$PLUGIN\pyproject.toml"

          # Test 1: uv sync 建出 venv
          uv sync --project $PLUGIN --python $PYTHON
          if (-not (Test-Path "$PLUGIN\.venv\Scripts\python.exe")) {
            Write-Error "FAIL: venv python not created"
            exit 1
          }
          Write-Host "PASS: uv sync created venv with python.exe"

          # Test 1b: venv 确实是 3.14
          $VERSION = & "$PLUGIN\.venv\Scripts\python.exe" -c "import sys; print(f'{sys.version_info[0]}.{sys.version_info[1]}')"
          if ($VERSION.Trim() -ne "3.14") {
            Write-Error "FAIL: venv reports Python $VERSION, expected 3.14"
            exit 1
          }
          Write-Host "PASS: venv runs Python $VERSION"

          # Test 2: 破损 venv 自愈
          Remove-Item "$PLUGIN\.venv\Scripts\python.exe"
          uv sync --project $PLUGIN --python $PYTHON
          if (-not (Test-Path "$PLUGIN\.venv\Scripts\python.exe")) {
            Write-Error "FAIL: broken venv not recovered"
            exit 1
          }
          Write-Host "PASS: uv sync recovered broken venv"

          # Test 3: PYTHONHOME 已设置（模拟 in-app 环境）
          Remove-Item -Recurse -Force "$PLUGIN\.venv"
          $env:PYTHONHOME = (& $PYTHON -c "import sys; print(sys.prefix)" | Select-Object -Last 1).Trim()
          uv sync --project $PLUGIN --python $PYTHON
          $env:PYTHONHOME = $null
          if (-not (Test-Path "$PLUGIN\.venv\Scripts\python.exe")) {
            Write-Error "FAIL: uv sync failed with PYTHONHOME set"
            exit 1
          }
          Write-Host "PASS: uv sync works with PYTHONHOME set"

          # Test 4: PYTHONHOME 指向错误位置
          Remove-Item -Recurse -Force "$PLUGIN\.venv"
          $env:PYTHONHOME = "C:\nonexistent\path"
          uv sync --project $PLUGIN --python $PYTHON
          $env:PYTHONHOME = $null
          if (-not (Test-Path "$PLUGIN\.venv\Scripts\python.exe")) {
            Write-Error "FAIL: uv sync failed with wrong PYTHONHOME"
            exit 1
          }
          Write-Host "PASS: uv sync resilient to wrong PYTHONHOME"

  # -------------------------------------------------------------------------
  # 开发/验证构建：编译 + 三组 CPU 测试 + 构建树内 nvJPEG2000 校验。
  # 不再手工拼 dist —— 可分发包由 package-windows 用项目自带的 portable 路径产出。
  # -------------------------------------------------------------------------
  build-windows:
    needs: windows-preflight
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_BUILD_TYPE: release
      CUDA_PATH: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.4'
      BUILD_DIR: b

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: Resolve the uv-managed Python
        shell: pwsh
        run: |
          uv python install $env:PYTHON_VERSION
          Push-Location $env:TEMP
          $PYTHON = (uv python find $env:PYTHON_VERSION | Select-Object -Last 1).Trim()
          Pop-Location
          if (-not $PYTHON -or -not (Test-Path $PYTHON)) {
            Write-Error "FAIL: uv 未能提供 Python $env:PYTHON_VERSION 解释器"
            exit 1
          }
          "UV_PYTHON=$PYTHON" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $PYTHON --version

      # 在装 CUDA 之前就断言路径，避免白烧几十分钟才死在 nvcc 上
      - name: Verify toolchain paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:VCVARS)) {
            throw "vcvars64.bat not found at '$env:VCVARS' - wrong runner image for this VS version?"
          }
          Write-Host "VCVARS OK: $env:VCVARS"

      - name: Install CUDA ${{ env.CUDA_VERSION }}
        run: |
          cd ..
          Invoke-WebRequest $env:CUDA_INSTALLER -OutFile cuda.exe -Verbose
          Start-Process -FilePath .\cuda.exe -ArgumentList "-y -s -accepteula -toolkit -override -noDisplayDriver" -Wait

      - name: Set CUDA environment
        run: |
          echo "CUDA_PATH=$env:CUDA_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$env:CUDA_PATH_ENV_NAME=$env:CUDA_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$env:CUDA_ROOT\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$env:CUDA_ROOT\libnvvp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Normalize vcpkg path
        run: '"VCPKG_ROOT=$([System.IO.Path]::GetFullPath($env:VCPKG_ROOT))" >> $env:GITHUB_ENV'

      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-tool-${{ runner.os }}-2026-09-27
          restore-keys: vcpkg-tool-${{ runner.os }}-

      # 必须幂等：新 key 未命中时 restore-keys 会前缀命中旧缓存把目录恢复出来，
      # 此时 cache-hit 仍是 false，直接 git clone 会因目录非空而失败。
      - name: Setup vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          cd ..
          if (Test-Path vcpkg) {
            git -C vcpkg fetch --all --prune
            git -C vcpkg reset --hard origin/master
          } else {
            git clone https://github.com/microsoft/vcpkg.git
          }
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Cache vcpkg_installed
        uses: actions/cache@v6
        with:
          path: ${{ env.BUILD_DIR }}/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-prebuilt-ort-v2-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/overlays/**') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-prebuilt-ort-v2-

      - name: Configure
        shell: cmd
        run: |
          call "%VCVARS%" %VCVARS_ARGS% || exit /b 1
          where cl.exe
          cmake -B %BUILD_DIR% -S . -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DLFS_FAST_COMPILE=ON -DBUILD_FORMAT_TESTS=ON -DBUILD_VISUALIZER_TESTS=ON -DBUILD_UNICODE_TEST_ONLY=ON -DBUILD_PYTHON_STUBS=OFF -DLFS_DEV_IMPORT_SOURCE_PYTHON=OFF -DLFS_DEV_IMPORT_SOURCE_RESOURCES=OFF -DLFS_ENABLE_CUDA_DEVICE_DEBUG=OFF

      - name: Generate shader headers for preflight
        shell: cmd
        env:
          VCPKG_RUNTIME_SUBDIR: ${{ matrix.build_type == 'Debug' && 'debug\bin' || 'bin' }}
        run: |
          call "%VCVARS%" %VCVARS_ARGS% || exit /b 1
          set PATH=%CD%\%BUILD_DIR%\vcpkg_installed\x64-windows\%VCPKG_RUNTIME_SUBDIR%;%PATH%
          cmake --build %BUILD_DIR% --target lfs_shader_headers --config ${{ matrix.build_type }} -j 4

      - name: Run configured MSVC preflight
        shell: cmd
        env:
          LFS_PREFLIGHT_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          call "%VCVARS%" %VCVARS_ARGS% || exit /b 1
          "%UV_PYTHON%" tools\windows_build_preflight.py --skip-source-checks --compile-commands %BUILD_DIR%\compile_commands.json --max-commands 512

      - name: Build
        shell: cmd
        run: |
          call "%VCVARS%" %VCVARS_ARGS% || exit /b 1
          set PATH=%CD%\%BUILD_DIR%;%CD%\%BUILD_DIR%\vcpkg_installed\x64-windows\bin;%PATH%
          cmake --build %BUILD_DIR% -j %NUMBER_OF_PROCESSORS%

      - name: Build and run CPU-only format tests
        shell: cmd
        run: |
          call "%VCVARS%" %VCVARS_ARGS% || exit /b 1
          cmake --build %BUILD_DIR% --target lichtfeld_format_tests -j %NUMBER_OF_PROCESSORS%
          ctest --test-dir %BUILD_DIR% --output-on-failure -R "^lichtfeld_format_tests$"

      - name: Build and run CPU-only Unicode path tests
        shell: cmd
        run: |
          call "%VCVARS%" %VCVARS_ARGS% || exit /b 1
          cmake --build %BUILD_DIR% --target unicode_path_test -j %NUMBER_OF_PROCESSORS%
          %BUILD_DIR%\tests\unicode_path_test.exe --gtest_color=no

      - name: Build and run CPU-only visualizer tests
        shell: cmd
        env:
          VCPKG_RUNTIME_SUBDIR: ${{ matrix.build_type == 'Debug' && 'debug\bin' || 'bin' }}
        run: |
          call "%VCVARS%" %VCVARS_ARGS% || exit /b 1
          set PATH=%CD%\%BUILD_DIR%;%CD%\%BUILD_DIR%\vcpkg_installed\x64-windows\%VCPKG_RUNTIME_SUBDIR%;%CD%\%BUILD_DIR%\vcpkg_installed\x64-windows\bin;%CD%\%BUILD_DIR%\vcpkg_installed\x64-windows\tools\python3;%CUDA_PATH%\bin;%PATH%
          cmake --build %BUILD_DIR% --target lichtfeld_visualizer_tests -j %NUMBER_OF_PROCESSORS%
          ctest --test-dir %BUILD_DIR% --output-on-failure -R "^lichtfeld_visualizer_tests$"

      - name: Verify nvJPEG2000 runtime bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:BUILD_DIR 'nvjpeg2k_0.dll'
          $extensionDir = Join-Path $env:BUILD_DIR 'extensions'
          $extensions = @(Get-ChildItem $extensionDir -Filter 'nvjpeg2k_ext*.dll' -ErrorAction SilentlyContinue)
          if (-not (Test-Path $runtime)) {
            throw "nvJPEG2000 runtime DLL was not bundled next to the binary: $runtime"
          }
          if ($extensions.Count -eq 0) {
            throw "nvjpeg2k extension DLL was not bundled in $extensionDir"
          }
          Write-Host "Found nvJPEG2000 runtime: $runtime"
          $extensions | ForEach-Object { Write-Host "Found nvjpeg2k extension: $($_.FullName)" }

  # -------------------------------------------------------------------------
  # 可分发包：走项目自带的 portable 路径（docs/building_and_distribution.md）。
  #
  # 为什么用 BUILD_PORTABLE 而不是手工拼 dist：
  #   - 它会强制 BUILD_CUDA_PTX_ONLY=ON、BUILD_TESTS=OFF、BUILD_FORMAT_TESTS=OFF，
  #     并在代码层关闭两个 dev-import 开关，开发路径不会漏进分发包；
  #   - install 规则把资源放到 share/LichtFeld-Studio，正好命中运行时探测
  #     getResourceBaseDir() 的第一段 exe目录/../share/LichtFeld-Studio；
  #   - IncludeRequiredSystemLibraries + GET_RUNTIME_DEPENDENCIES 自动带入
  #     MSVC/UCRT/OpenMP 运行时与全部 DLL 依赖（nvcuda.dll 由驱动提供，已排除）。
  #
  # 注意：这里**故意不传 LFS_FAST_COMPILE** —— 它的语义是"牺牲运行时性能换编译
  # 速度（WIN32 only）"，只适合 CI 验证腿，不适合要发出去的二进制。
  # 也**不传**测试相关开关（portable 会强制关掉）。
  # -------------------------------------------------------------------------
  package-windows:
    needs: windows-preflight
    runs-on: windows-2025-vs2026
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_BUILD_TYPE: release
      CUDA_PATH: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.4'
      # 与 build-windows 保持同名构建目录：vcpkg_installed 缓存里内嵌的是绝对路径，
      # 目录名一致才能让恢复出来的那份缓存继续有效（改名=缓存失效=重编 1.6h）。
      BUILD_DIR: b
      DIST_DIR: dist

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: Resolve the uv-managed Python
        shell: pwsh
        run: |
          uv python install $env:PYTHON_VERSION
          Push-Location $env:TEMP
          $PYTHON = (uv python find $env:PYTHON_VERSION | Select-Object -Last 1).Trim()
          Pop-Location
          if (-not $PYTHON -or -not (Test-Path $PYTHON)) {
            Write-Error "FAIL: uv 未能提供 Python $env:PYTHON_VERSION 解释器"
            exit 1
          }
          "UV_PYTHON=$PYTHON" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $PYTHON --version

      - name: Verify toolchain paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:VCVARS)) {
            throw "vcvars64.bat not found at '$env:VCVARS' - wrong runner image for this VS version?"
          }
          Write-Host "VCVARS OK: $env:VCVARS"

      - name: Install CUDA ${{ env.CUDA_VERSION }}
        run: |
          cd ..
          Invoke-WebRequest $env:CUDA_INSTALLER -OutFile cuda.exe -Verbose
          Start-Process -FilePath .\cuda.exe -ArgumentList "-y -s -accepteula -toolkit -override -noDisplayDriver" -Wait

      - name: Set CUDA environment
        run: |
          echo "CUDA_PATH=$env:CUDA_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$env:CUDA_PATH_ENV_NAME=$env:CUDA_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$env:CUDA_ROOT\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$env:CUDA_ROOT\libnvvp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Normalize vcpkg path
        run: '"VCPKG_ROOT=$([System.IO.Path]::GetFullPath($env:VCPKG_ROOT))" >> $env:GITHUB_ENV'

      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-tool-${{ runner.os }}-2026-09-27
          restore-keys: vcpkg-tool-${{ runner.os }}-

      - name: Setup vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          cd ..
          if (Test-Path vcpkg) {
            git -C vcpkg fetch --all --prune
            git -C vcpkg reset --hard origin/master
          } else {
            git clone https://github.com/microsoft/vcpkg.git
          }
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      # 与 build-windows 同 key 同路径 → 直接命中，省掉约 1.6h 的依赖编译
      - name: Cache vcpkg_installed
        uses: actions/cache@v6
        with:
          path: ${{ env.BUILD_DIR }}/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-prebuilt-ort-v2-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/overlays/**') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-prebuilt-ort-v2-

      # 可选加速：项目 ENABLE_COMPILER_CACHE 默认为 ON 且会自动探测 sccache，
      # 装上即可让 C++ 目标（CUDA 在 Windows 上被项目主动禁用缓存）跨 run 命中。
      # 取消下面注释即可启用；如遇奇怪链接错误，先把它关掉再排查。
      # - name: Setup sccache
      #   uses: mozilla-actions/sccache-action@v0.0.11
      # - name: Enable sccache GHA backend
      #   shell: pwsh
      #   run: |
      #     "SCCACHE_GHA_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      #     "SCCACHE_CACHE_SIZE=20G" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure (portable)
        shell: cmd
        run: |
          call "%VCVARS%" %VCVARS_ARGS% || exit /b 1
          where cl.exe
          cmake -B %BUILD_DIR% -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PORTABLE=ON

      - name: Build (portable)
        shell: cmd
        run: |
          call "%VCVARS%" %VCVARS_ARGS% || exit /b 1
          cmake --build %BUILD_DIR% -j %NUMBER_OF_PROCESSORS%

      - name: Install (portable)
        shell: cmd
        run: cmake --install %BUILD_DIR% --prefix %DIST_DIR%

      # 断言 install 布局与运行时探测规则一致：
      # getResourceBaseDir() 查 exe目录/../share/LichtFeld-Studio，
      # 以及 exe目录/resources。资源不是内嵌的，缺一个就会在启动时报
      # "Cannot find asset: rmlui/scene_tree.rml"。
      - name: Verify portable layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = $env:DIST_DIR
          $bin = Join-Path $dist 'bin'
          $share = Join-Path $dist ("share\LichtFeld-Studio")

          Write-Host "---- dist tree (depth 3) ----"
          Get-ChildItem $dist -Recurse -Depth 3 -Directory | ForEach-Object { Write-Host $_.FullName.Replace((Resolve-Path $dist).Path, 'dist') }

          $exes = @(Get-ChildItem $bin -Filter '*.exe' -ErrorAction SilentlyContinue)
          if ($exes.Count -eq 0) { throw "no exe installed in $bin" }
          Write-Host "exe: $($exes[0].Name)"

          # 资源：直接查那个当初报错的文件，命中即证明 exe目录/../share 规则可用
          $probe = Join-Path $share 'assets\rmlui\scene_tree.rml'
          if (-not (Test-Path $probe)) {
            Write-Host "---- installed assets ----"
            Get-ChildItem (Join-Path $share 'assets') -ErrorAction SilentlyContinue | Select-Object Name
            throw "scene_tree.rml missing at $probe - runtime asset lookup would fail"
          }
          Write-Host "OK resource: $probe"

          # nvJPEG2000：运行时应与 exe 同目录，扩展 DLL 在 dist\extensions
          $n2k = Join-Path $bin 'nvjpeg2k_0.dll'
          if (-not (Test-Path $n2k)) { throw "nvjpeg2k_0.dll missing from $bin" }
          Write-Host "OK runtime: $n2k"

          $extDir = Join-Path $dist 'extensions'
          $exts = @(Get-ChildItem $extDir -Filter 'nvjpeg2k_ext*.dll' -ErrorAction SilentlyContinue)
          if ($exts.Count -eq 0) {
            Write-Host "---- extensions ----"
            Get-ChildItem $extDir -ErrorAction SilentlyContinue | Select-Object Name
            throw "nvjpeg2k_ext*.dll missing from $extDir"
          }
          $exts | ForEach-Object { Write-Host "OK extension: $($_.Name)" }

          $size = (Get-ChildItem $dist -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1GB
          Write-Host ("dist size: {0:N2} GB" -f $size)

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: lichtfeld-windows-portable
          path: ${{ env.DIST_DIR }}/**
          if-no-files-found: error
          retention-days: 14
          # DLL 本身已压缩，0 = 只打包不压缩，上传快很多
          compression-level: 0
